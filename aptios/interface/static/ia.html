<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IA da Aptios</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2a5bd7">
<link rel="icon" href="/static/icone-192.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});</script>
<style>
:root {
    --bg: #f4f7fb; --card: #ffffff; --texto: #1d2433; --suave: #5b6578;
    --borda: #d9e0ea; --primaria: #2f6fed; --primaria-texto: #ffffff;
    --tutor: #eef3ff; --estudante: #2f6fed; --estudante-texto: #ffffff; --codigo: #1d2433; --codigo-texto: #e8edf7;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #11151c; --card: #1a202b; --texto: #e8edf7; --suave: #9aa5b8;
        --borda: #2c3545; --primaria: #5b8dff; --tutor: #222b3a; --estudante: #3d6fe0; --codigo: #0b0e13;
    }
}
:root[data-theme="dark"] {
    --bg: #11151c; --card: #1a202b; --texto: #e8edf7; --suave: #9aa5b8;
    --borda: #2c3545; --primaria: #5b8dff; --tutor: #222b3a; --estudante: #3d6fe0; --codigo: #0b0e13;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--texto); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
.app { max-width: 760px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; padding: 0 16px; }
header { padding: 18px 0 10px; text-align: center; }
h1 { margin: 0; font-size: 1.6rem; }
.sub { margin: 2px 0 0; color: var(--suave); font-size: .95rem; }
.nav { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
.nav a { color: var(--primaria); font-weight: 700; text-decoration: none; font-size: .95rem; }
.kits { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin: 12px 0; }
.kit { border: 2px solid var(--borda); background: var(--card); color: var(--texto); border-radius: 14px; padding: 10px 4px; font: inherit; font-size: .85rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.kit span { font-size: 1.6rem; }
.kit[aria-pressed="true"] { border-color: var(--primaria); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primaria) 25%, transparent); font-weight: 700; }
#chat { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 8px 0 16px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.tutor { background: var(--tutor); align-self: flex-start; border-bottom-left-radius: 4px; }
.estudante { background: var(--estudante); color: var(--estudante-texto); align-self: flex-end; border-bottom-right-radius: 4px; }
.msg pre { background: var(--codigo); color: var(--codigo-texto); padding: 10px; border-radius: 10px; overflow-x: auto; white-space: pre; font-size: .85rem; margin: 6px 0; }
.sugestoes { display: flex; flex-wrap: wrap; gap: 6px; }
.sugestao { border: 1px solid var(--borda); background: var(--card); color: var(--texto); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: .85rem; cursor: pointer; }
form { position: sticky; bottom: 0; background: var(--bg); display: flex; gap: 8px; padding: 10px 0 16px; }
textarea { flex: 1; resize: none; border: 2px solid var(--borda); border-radius: 14px; padding: 10px 12px; font: inherit; background: var(--card); color: var(--texto); min-height: 48px; max-height: 160px; }
textarea:focus { outline: none; border-color: var(--primaria); }
button.enviar { border: 0; border-radius: 14px; background: var(--primaria); color: var(--primaria-texto); font: inherit; font-weight: 700; padding: 0 18px; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
.aviso { text-align: center; color: var(--suave); font-size: .78rem; margin: 0 0 8px; }
@media (max-width: 480px) { .kit { font-size: .72rem; } .kit span { font-size: 1.3rem; } }
</style>
</head>
<body>
<div class="app">
    <header>
        <h1>🤖 IA da Aptios</h1>
        <p class="sub">Sua ajudante de robótica, programação e física</p>
        <nav class="nav"><a href="/">🏠 Início</a><a href="/oficina">🧱 Oficina</a><a href="/pista">🏎 Pista</a></nav>
    </header>

    <div class="kits" role="group" aria-label="Escolha seu kit">
        <button class="kit" data-kit="scratch" aria-pressed="true"><span>🐱</span>Scratch</button>
        <button class="kit" data-kit="lego_spike" aria-pressed="false"><span>🟨</span>LEGO SPIKE</button>
        <button class="kit" data-kit="lego_ev3" aria-pressed="false"><span>🧱</span>LEGO EV3</button>
        <button class="kit" data-kit="arduino" aria-pressed="false"><span>🔌</span>Arduino</button>
        <button class="kit" data-kit="pista" aria-pressed="false"><span>🏎</span>Carros e física</button>
    </div>

    <main id="chat" aria-live="polite"></main>

    <form id="form">
        <textarea id="pergunta" rows="1" maxlength="1000" placeholder="Escreva sua pergunta..." aria-label="Sua pergunta"></textarea>
        <button class="enviar" id="enviar" type="submit">Enviar</button>
    </form>
    <p class="aviso">A IA da Aptios pode errar. Teste sempre e peça ajuda a um adulto com eletricidade e ferramentas. As conversas não são guardadas.</p>
</div>

<script>
const SUGESTOES = {
    scratch:    ['Como faço o gato andar?', 'O que é uma variável?', 'Como criar um jogo de pegar maçãs?'],
    lego_spike: ['Como fazer o robô andar para frente?', 'Como usar o sensor de cor?', 'Desafio: seguir uma linha preta'],
    lego_ev3:   ['Como ligar os motores?', 'Como o robô desvia de obstáculos?', 'O que faz o giroscópio?'],
    arduino:    ['Como piscar um LED?', 'O que é um resistor?', 'Como usar um sensor de distância?'],
    pista:      ['Por que o carro derrapa na curva?', 'Por que carro elétrico acelera tão rápido?', 'Como um carro poderia voar?'],
};
const BOAS_VINDAS = {
    scratch: 'Oi! 🐱 Vamos programar no Scratch? Me conta o que você quer criar!',
    lego_spike: 'Oi! 🟨 Vamos montar e programar com o LEGO SPIKE? Qual é o seu robô?',
    lego_ev3: 'Oi! 🧱 Vamos dar vida ao seu LEGO EV3? O que você quer que ele faça?',
    arduino: 'Oi! 🔌 Vamos de Arduino? Dica: dá para testar tudo no Tinkercad antes de ligar os fios de verdade!',
    pista: 'Oi! 🏎 Vamos falar de carros e física? Pergunte sobre forças, curvas, baterias ou sobre o Roadster que voa da Pista!',
};

let kit = 'scratch';
let historico = [];   // fica só aqui no navegador, nunca é salvo
let ocupado = false;

const chat = document.getElementById('chat');
const form = document.getElementById('form');
const campo = document.getElementById('pergunta');
const botao = document.getElementById('enviar');

// Mostra o texto com segurança: escapa HTML e transforma ```código``` e **negrito**.
function formatar(texto) {
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return texto.split('```').map((parte, i) => {
        if (i % 2 === 1) return '<pre>' + esc(parte.replace(/^[a-zA-Z+]*\n/, '')) + '</pre>';
        return esc(parte).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    }).join('');
}

function balao(autor, texto) {
    const div = document.createElement('div');
    div.className = 'msg ' + autor;
    div.innerHTML = formatar(texto);
    chat.appendChild(div);
    div.scrollIntoView({ block: 'end', behavior: 'smooth' });
    return div;
}

function recomecar() {
    historico = [];
    chat.innerHTML = '';
    balao('tutor', BOAS_VINDAS[kit]);
    const caixa = document.createElement('div');
    caixa.className = 'sugestoes';
    for (const s of SUGESTOES[kit]) {
        const b = document.createElement('button');
        b.className = 'sugestao'; b.type = 'button'; b.textContent = s;
        b.onclick = () => { caixa.remove(); enviar(s); };
        caixa.appendChild(b);
    }
    chat.appendChild(caixa);
}

async function enviar(pergunta) {
    pergunta = pergunta.trim();
    if (!pergunta || ocupado) return;
    ocupado = true; botao.disabled = true;
    document.querySelector('.sugestoes')?.remove();
    balao('estudante', pergunta);
    const resposta = balao('tutor', '…');
    let texto = '';
    try {
        const r = await fetch('/api/perguntar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ kit, pergunta, historico }),
        });
        if (!r.ok) {
            const erro = await r.json().catch(() => ({}));
            texto = '⚠️ ' + (erro.detail && typeof erro.detail === 'string' ? erro.detail : 'Não consegui enviar. Tente de novo.');
        } else {
            const leitor = r.body.getReader();
            const dec = new TextDecoder();
            for (;;) {
                const { value, done } = await leitor.read();
                if (done) break;
                texto += dec.decode(value, { stream: true });
                resposta.innerHTML = formatar(texto);
                resposta.scrollIntoView({ block: 'end' });
            }
            if (texto.trim()) historico.push({ autor: 'estudante', texto: pergunta }, { autor: 'tutor', texto });
        }
    } catch {
        texto = '📡 Sem conexão com o tutor. Confira a internet e tente de novo.';
    }
    resposta.innerHTML = formatar(texto || '🤔 Não veio resposta. Tente perguntar de outro jeito.');
    ocupado = false; botao.disabled = false; campo.focus();
}

document.querySelectorAll('.kit').forEach(b => b.onclick = () => {
    if (ocupado) return;
    document.querySelectorAll('.kit').forEach(x => x.setAttribute('aria-pressed', x === b));
    kit = b.dataset.kit;
    recomecar();
});
form.onsubmit = e => { e.preventDefault(); const p = campo.value; campo.value = ''; enviar(p); };
campo.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
// /ia?kit=pista já abre no kit certo (a Pista e a Oficina usam isso nos links)
const pedido = new URLSearchParams(location.search).get('kit');
const botaoPedido = [...document.querySelectorAll('.kit')].find(b => b.dataset.kit === pedido);
if (botaoPedido) { document.querySelectorAll('.kit').forEach(x => x.setAttribute('aria-pressed', x === botaoPedido)); kit = pedido; }
recomecar();
</script>
</body>
</html>
