<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: bancada 3D grande à esquerda, painel de ferramentas à direita (empilha no celular). */
:root {
    --fundo: #e9eef3;
    --painel: #ffffff;
    --tinta: #1b2430;
    --suave: #5d6b7c;
    --linha: #d3dbe4;
    --amarelo: #ffcf33;
    --amarelo-tinta: #2a2100;
    --azul: #2a5bd7;
    --azul-tinta: #ffffff;
    --verde: #1f9d55;
    --vermelho: #d64545;
    --cena: #dfe6ee;
    --base: #b9c6d4;
    --fonte-titulo: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    --fonte-texto: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --fundo: #11161d; --painel: #1a212b; --tinta: #e9eef5; --suave: #98a6b8; --linha: #2c3644;
        --azul: #6d93ff; --azul-tinta: #0b1020; --cena: #151c25; --base: #2b3644; color-scheme: dark;
    }
}
:root[data-theme="dark"] {
    --fundo: #11161d; --painel: #1a212b; --tinta: #e9eef5; --suave: #98a6b8; --linha: #2c3644;
    --azul: #6d93ff; --azul-tinta: #0b1020; --cena: #151c25; --base: #2b3644; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
    margin: 0; background: var(--fundo); color: var(--tinta);
    font: 16px/1.45 var(--fonte-texto);
    display: flex; flex-direction: column;
}
.topo {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    border-bottom: 1px solid var(--linha); background: var(--painel);
}
.marca { font: 700 1.35rem var(--fonte-titulo); letter-spacing: .01em; margin: 0; }
.marca small { font-weight: 500; color: var(--suave); }
.espaco { flex: 1; }
.saldo {
    display: inline-flex; align-items: center; gap: 6px; font: 700 1rem var(--fonte-titulo);
    background: var(--amarelo); color: var(--amarelo-tinta); padding: 6px 14px; border-radius: 999px;
    font-variant-numeric: tabular-nums;
}
.saldo.pulo { animation: pulo .5s ease; }
@keyframes pulo { 50% { transform: scale(1.15); } }
.link { color: var(--azul); font-weight: 800; text-decoration: none; }
.demo { font-size: .8rem; color: var(--suave); border: 1px dashed var(--linha); border-radius: 8px; padding: 3px 8px; }

.oficina { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
.bancada { position: relative; min-height: 0; background: var(--cena); }
.bancada canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.ferramentas {
    position: absolute; left: 12px; top: 12px; right: 12px;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; pointer-events: none;
}
.ferramentas > * { pointer-events: auto; }
.ferr {
    font: 600 .9rem var(--fonte-titulo); border: 1px solid var(--linha); background: var(--painel); color: var(--tinta);
    border-radius: 10px; padding: 7px 12px; cursor: pointer;
}
.ferr[aria-pressed="true"] { background: var(--azul); color: var(--azul-tinta); border-color: var(--azul); }
.ferr.ligar { background: var(--amarelo); color: var(--amarelo-tinta); border-color: var(--amarelo); font-weight: 700; }
.ferr:disabled { opacity: .45; cursor: default; }
.status { font-size: .85rem; color: var(--suave); background: var(--painel); border-radius: 8px; padding: 4px 10px; border: 1px solid var(--linha); }
.dica {
    position: absolute; left: 12px; bottom: 12px; right: 12px; pointer-events: none;
    font-size: .82rem; color: var(--suave);
}

.painel { background: var(--painel); border-left: 1px solid var(--linha); display: flex; flex-direction: column; min-height: 0; }
.abas { display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--linha); }
.aba {
    font: 600 .92rem var(--fonte-titulo); background: none; border: 0; color: var(--suave);
    padding: 12px 4px; cursor: pointer; border-bottom: 3px solid transparent;
}
.aba[aria-selected="true"] { color: var(--tinta); border-bottom-color: var(--amarelo); }
.conteudo { overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.conteudo h2 { font: 600 1.05rem var(--fonte-titulo); margin: 6px 0 0; }
.explica { margin: 0; color: var(--suave); font-size: .9rem; }

.grade-pecas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.peca {
    display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: center; text-align: left;
    border: 2px solid var(--linha); background: var(--painel); color: var(--tinta); border-radius: 12px;
    padding: 8px; cursor: pointer; font: inherit; font-size: .88rem; font-weight: 700; min-width: 0;
}
.peca[aria-pressed="true"] { border-color: var(--azul); box-shadow: 0 0 0 3px color-mix(in srgb, var(--azul) 22%, transparent); }
.amostra { width: 28px; height: 28px; border-radius: 7px; border: 1px solid rgba(0,0,0,.15); }

.item { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--linha); }
.item .amostra { width: 36px; height: 36px; }
.item strong { display: block; }
.item p { margin: 0; font-size: .84rem; color: var(--suave); }
.botao {
    font: 700 .85rem var(--fonte-titulo); border: 0; border-radius: 10px; padding: 8px 12px; cursor: pointer;
    background: var(--azul); color: var(--azul-tinta); white-space: nowrap;
}
.botao:disabled { opacity: .45; cursor: default; }
.botao.amarelo { background: var(--amarelo); color: var(--amarelo-tinta); }

.trilha { font: 600 .75rem var(--fonte-titulo); text-transform: uppercase; letter-spacing: .08em; color: var(--suave); margin-top: 8px; }
.desafio { border: 1px solid var(--linha); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.desafio h3 { margin: 0; font: 600 .98rem var(--fonte-titulo); display: flex; justify-content: space-between; gap: 8px; }
.premio { color: var(--verde); white-space: nowrap; font-variant-numeric: tabular-nums; }
.desafio p { margin: 0; font-size: .92rem; }
.opcoes { display: grid; gap: 6px; }
.opcao { text-align: left; border: 1px solid var(--linha); background: var(--fundo); color: var(--tinta); border-radius: 9px; padding: 7px 10px; font: inherit; font-size: .88rem; cursor: pointer; }
.opcao:hover:not(:disabled) { border-color: var(--azul); }
.feito { color: var(--verde); font-weight: 800; font-size: .9rem; }

.filtros { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 600 .82rem var(--fonte-titulo); border: 1px solid var(--linha); background: var(--painel); color: var(--tinta); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--tinta); color: var(--painel); border-color: var(--tinta); }
.nivel { font: 600 .7rem var(--fonte-titulo); text-transform: uppercase; letter-spacing: .06em; border-radius: 6px; padding: 2px 7px; }
.nivel-facil { background: color-mix(in srgb, var(--verde) 18%, transparent); color: var(--verde); }
.nivel-medio { background: color-mix(in srgb, var(--amarelo) 35%, transparent); color: var(--tinta); }
.nivel-dificil { background: color-mix(in srgb, var(--vermelho) 18%, transparent); color: var(--vermelho); }
.ficha { display: grid; gap: 5px; font-size: .84rem; }
.ficha-linha { display: grid; grid-template-columns: 92px 1fr 34px; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.barra { height: 9px; border-radius: 5px; background: var(--linha); overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--azul); border-radius: 5px; transition: width .35s ease; }
.golpes { display: flex; flex-wrap: wrap; gap: 5px; }
.golpe { font: 600 .74rem var(--fonte-titulo); border: 1px solid var(--linha); border-radius: 999px; padding: 2px 9px; background: var(--fundo); cursor: help; }
.rival { border: 1px solid var(--linha); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.rival h3 { margin: 0; font: 600 1rem var(--fonte-titulo); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rival p { margin: 0; font-size: .86rem; color: var(--suave); }
.placar { display: grid; gap: 10px; }
.lutador { display: grid; gap: 4px; }
.lutador strong { display: flex; justify-content: space-between; font-family: var(--fonte-titulo); }
.vida { height: 14px; border-radius: 7px; background: var(--linha); overflow: hidden; }
.vida > i { display: block; height: 100%; transition: width .3s ease; }
.vida.voce > i { background: var(--verde); }
.vida.rival > i { background: var(--vermelho); }
.relato { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .86rem; }
.relato li { padding: 4px 8px; border-radius: 7px; background: var(--fundo); }
.resultado { text-align: center; border: 2px solid var(--amarelo); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.resultado strong { font: 700 1.3rem var(--fonte-titulo); }
.aviso { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20;
    max-width: min(520px, calc(100% - 32px)); background: var(--tinta); color: var(--fundo); padding: 10px 16px; border-radius: 12px;
    font-size: .92rem; box-shadow: 0 8px 30px rgba(0,0,0,.25); }

:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }
@media (max-width: 820px) {
    .oficina { grid-template-columns: 1fr; grid-template-rows: 55vh auto; }
    .painel { border-left: 0; border-top: 1px solid var(--linha); }
    .conteudo { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .saldo.pulo { animation: none; } }
</style>

<body>
<header class="topo">
    <h1 class="marca">Aptios <small>Oficina</small></h1>
    <span class="demo" id="selo-demo" hidden>modo demonstração</span>
    <span class="espaco"></span>
    <a class="link" id="link-tutor" href="/">🤖 Tutor</a>
    <span class="saldo" id="saldo" title="Seus tokens">⚙ <span id="saldo-num">0</span> tokens</span>
</header>

<main class="oficina">
    <section class="bancada" id="bancada" aria-label="Bancada 3D">
        <div class="ferramentas">
            <button class="ferr" id="modo-colocar" aria-pressed="true">🧱 Colocar</button>
            <button class="ferr" id="modo-apagar" aria-pressed="false">🧽 Tirar</button>
            <button class="ferr" id="girar">↻ Girar (R)</button>
            <button class="ferr" id="limpar">🗑 Limpar tudo</button>
            <button class="ferr ligar" id="ligar">▶ Ligar robô</button>
            <span class="status" id="status">Carregando…</span>
        </div>
        <p class="dica">Clique para colocar a peça. Arraste para girar a câmera e use a rodinha ou dois dedos para o zoom.</p>
    </section>

    <aside class="painel">
        <nav class="abas" role="tablist">
            <button class="aba" role="tab" data-aba="pecas" aria-selected="true">Peças</button>
            <button class="aba" role="tab" data-aba="loja" aria-selected="false">Loja</button>
            <button class="aba" role="tab" data-aba="desafios" aria-selected="false">Desafios</button>
            <button class="aba" role="tab" data-aba="arena" aria-selected="false">Arena</button>
            <button class="aba" role="tab" data-aba="tokens" aria-selected="false">Tokens</button>
        </nav>
        <div class="conteudo" id="conteudo"></div>
    </aside>
</main>
<div class="aviso" id="aviso" hidden></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ═════════════════════════════════════════════════════════════════
//  ADAPTADORES DA API — a mesma "porta", dois jeitos de funcionar:
//  • servidor: fala com o Python (as regras de verdade ficam lá)
//  • demonstração: tudo no navegador, só para mostrar a prévia
// ═════════════════════════════════════════════════════════════════
const ler = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const gravar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

function apiServidor() {
    let codigo = ler('aptios_codigo');
    async function req(metodo, caminho, corpo) {
        const r = await fetch('/api/oficina' + caminho, {
            method: metodo,
            headers: { 'Content-Type': 'application/json', 'X-Explorador': codigo || '' },
            body: corpo ? JSON.stringify(corpo) : undefined,
        });
        const dados = await r.json().catch(() => ({}));
        if (!r.ok) { const e = new Error(typeof dados.detail === 'string' ? dados.detail : 'Algo deu errado.'); e.status = r.status; throw e; }
        return dados;
    }
    return {
        demo: false,
        catalogo: () => req('GET', '/catalogo'),
        async entrar() {
            if (codigo) { try { return await req('GET', '/eu'); } catch (e) { if (e.status !== 404) throw e; } }
            const novo = await req('POST', '/exploradores');
            codigo = novo.codigo; gravar('aptios_codigo', codigo);
            return novo;
        },
        desafio: (id, resposta) => req('POST', '/desafios/' + id, { resposta }),
        comprar: (id) => req('POST', '/pecas/' + id),
        salvarRobo: (pecas) => req('PUT', '/robo', { pecas }),
        comprarTokens: (id) => req('POST', '/tokens/' + id),
        arena: () => req('GET', '/arena'),
        batalhar: (id) => req('POST', '/batalhas/' + id),
        modelo: (id) => '/static/modelos/' + id + '.glb',
    };
}

function apiDemo({ catalogo, respostas, rivais }) {
    const pecas = Object.fromEntries(catalogo.pecas.map(p => [p.id, p]));
    // ⚠️ Cópia das fórmulas de aptios/oficina/batalha.py, SÓ para a prévia sem servidor.
    // No site de verdade, quem calcula é o Python. Mudou lá? Mude aqui também.
    function atributosJS(lista) {
        const ps = lista.map(c => pecas[c.peca_id]), conta = (...ids) => ps.filter(p => ids.includes(p.id)).length;
        if (!ps.some(p => p.categoria === 'controlador')) erro('o robô precisa de um controlador para lutar');
        if (conta('roda_pequena', 'roda_grande') < 2 && !conta('esteira')) erro('o robô precisa de rodas (2 ou mais) ou de uma esteira para lutar');
        const est = ps.filter(p => p.categoria === 'estrutura'), blocos = est.reduce((t, p) => t + p.tamanho[0] * p.tamanho[2], 0), mot = conta('motor');
        return {
            vida: Math.min(60 + blocos * 2 + conta('esteira') * 15, 200),
            ataque: Math.min(6 + conta('garra') * 9 + conta('servo') * 5 + mot * 3, 60),
            defesa: Math.min(est.length * 2 + conta('esteira') * 4, 30),
            velocidade: Math.min(2 + mot * 3 + conta('roda_grande') * 2 - conta('esteira'), 20),
            precisao: Math.min(55 + conta('sensor_distancia') * 15 + conta('sensor_cor') * 8 + conta('sensor_toque') * 4, 95),
            golpes: Object.keys(catalogo.golpes).filter(g => { const m = catalogo.golpes[g]; return !m.peca || conta(m.peca) >= (m.peca === 'motor' ? 2 : 1); }),
        };
    }
    function lutarJS(voce, rival) {
        const vida = { voce: voce.vida, rival: rival.vida }, ficha = { voce, rival }, golpes = [], ofuscado = { voce: false, rival: false };
        const sorteio = (n) => Math.floor(Math.random() * n);
        let vez = voce.velocidade > rival.velocidade || (voce.velocidade === rival.velocidade && Math.random() > .5) ? 'voce' : 'rival';
        for (let n = 0; n < 24; n++) {
            const alvo = vez === 'voce' ? 'rival' : 'voce', a = ficha[vez], d = ficha[alvo];
            const nome = a.golpes[sorteio(a.golpes.length)], mov = catalogo.golpes[nome];
            const chance = a.precisao + mov.mira - Math.min(d.velocidade * 1.5, 25) - (ofuscado[vez] ? 25 : 0);
            ofuscado[vez] = false;
            const acertou = Math.random() * 100 < chance;
            let dano = 0, efeito = '';
            if (acertou) {
                const defesa = nome === 'garrada' ? 0 : Math.floor(d.defesa / 3), extra = nome === 'turbo' ? Math.floor(a.velocidade / 2) : 0;
                dano = Math.max(2, Math.round(a.ataque * mov.dano) + extra - defesa + sorteio(5));
                if (nome === 'laser' && Math.random() < .3) { dano *= 2; efeito = 'critico'; }
                else if (nome === 'martelada' && Math.random() < .3) efeito = 'tonto';
                else if (nome === 'pisca') { efeito = 'ofuscado'; ofuscado[alvo] = true; }
            }
            vida[alvo] = Math.max(0, vida[alvo] - dano);
            golpes.push({ atacante: vez, golpe: nome, acertou, dano, vida_voce: vida.voce, vida_rival: vida.rival, efeito });
            if (!vida[alvo]) break;
            if (efeito !== 'tonto') vez = alvo;
        }
        return { golpes, vencedor: vida.voce > vida.rival ? 'voce' : vida.rival > vida.voce ? 'rival' : 'empate' };
    }
    let e;
    try { e = JSON.parse(ler('aptios_demo')); } catch {}
    e = e || { saldo: 0, pecas: catalogo.pecas.filter(p => p.preco === 0).map(p => p.id), desafios_feitos: [], robo: [] };
    e.vitorias ??= [];
    const salvar = () => { gravar('aptios_demo', JSON.stringify(e)); return structuredClone(e); };
    const erro = (m) => { throw new Error(m); };
    return {
        demo: true,
        catalogo: async () => catalogo,
        entrar: async () => salvar(),
        async desafio(id, resposta) {
            if (e.desafios_feitos.includes(id)) erro('você já ganhou os tokens deste desafio');
            const d = catalogo.desafios.find(x => x.id === id), r = respostas[id];
            if (resposta !== r.correta) return { acertou: false, explicacao: 'Quase! Pense mais um pouquinho e tente de novo.', ...salvar() };
            e.desafios_feitos.push(id); e.saldo += d.recompensa;
            return { acertou: true, explicacao: r.explicacao, ...salvar() };
        },
        async comprar(id) {
            const p = pecas[id];
            if (e.pecas.includes(id)) erro('você já tem esta peça. Pode usar quantas vezes quiser!');
            if (e.saldo < p.preco) erro(`faltam ${p.preco - e.saldo} tokens para esta peça`);
            e.saldo -= p.preco; e.pecas.push(id);
            return salvar();
        },
        async salvarRobo(lista) { e.robo = lista; return salvar(); },
        async arena() {
            let meus = null, problema = null;
            try { meus = atributosJS(e.robo); } catch (x) { problema = x.message; }
            return { meus_atributos: meus, problema, rivais: rivais.map(r => ({ ...r, atributos: atributosJS(r.pecas), vencido: e.vitorias.includes(r.id) })) };
        },
        async batalhar(id) {
            const r = rivais.find(x => x.id === id), voce = atributosJS(e.robo), dele = atributosJS(r.pecas);
            const { golpes, vencedor } = lutarJS(voce, dele);
            let premio = 0;
            if (vencedor === 'voce' && !e.vitorias.includes(id)) { e.vitorias.push(id); e.saldo += r.premio; premio = r.premio; }
            return { voce, rival: dele, golpes, vencedor, premio, ...salvar() };
        },
        async comprarTokens() { erro('a compra de tokens ainda não está disponível. Por enquanto, ganhe tokens resolvendo desafios! 🧩'); },
        modelo: () => null,
    };
}

const api = window.APTIOS_DEMO ? apiDemo(window.APTIOS_DEMO) : apiServidor();

// ═════════════════════════ ESTADO ═════════════════════════
let catalogo, eu;
let pecaAtual = 'bloco_2x2', giro = 0, modo = 'colocar', aba = 'pecas';
const $ = (id) => document.getElementById(id);
const porId = () => Object.fromEntries(catalogo.pecas.map(p => [p.id, p]));

function avisar(texto) {
    const el = $('aviso'); el.textContent = texto; el.hidden = false;
    clearTimeout(avisar.t); avisar.t = setTimeout(() => el.hidden = true, 3800);
}
function mostrarSaldo(animar) {
    $('saldo-num').textContent = eu.saldo;
    if (animar) { const s = $('saldo'); s.classList.remove('pulo'); void s.offsetWidth; s.classList.add('pulo'); }
}
const maiuscula = (t) => t.charAt(0).toUpperCase() + t.slice(1);

// ═════════════════════════ CENA 3D ═════════════════════════
const bancada = $('bancada');
const css = getComputedStyle(document.documentElement);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
bancada.prepend(renderer.domElement);

const cena = new THREE.Scene();
cena.background = new THREE.Color(css.getPropertyValue('--cena').trim());
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 500);
camera.position.set(16, 16, 20);
const controles = new OrbitControls(camera, renderer.domElement);
controles.target.set(0, 1, 0);
controles.enableDamping = true;
controles.maxPolarAngle = Math.PI * 0.49;
controles.minDistance = 6; controles.maxDistance = 70;

cena.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.1));
const sol = new THREE.DirectionalLight(0xffffff, 1.6);
sol.position.set(12, 24, 10); sol.castShadow = true;
sol.shadow.mapSize.set(2048, 2048);
Object.assign(sol.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20 });
cena.add(sol);

// Placa-base: 24 × 24 pinos. Cada pino = 1 unidade.
const TAM = 24, ALT = 1;  // ALT = altura de um bloco
const base = new THREE.Mesh(
    new THREE.BoxGeometry(TAM, 0.4, TAM),
    new THREE.MeshStandardMaterial({ color: css.getPropertyValue('--base').trim(), roughness: .9 }),
);
base.position.y = -0.2; base.receiveShadow = true; cena.add(base);
const pinoGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.16, 16);
const pinosBase = new THREE.InstancedMesh(pinoGeo, base.material, TAM * TAM);
{ const m = new THREE.Matrix4(); let i = 0;
  for (let x = 0; x < TAM; x++) for (let z = 0; z < TAM; z++) { m.makeTranslation(x - TAM / 2 + .5, .08, z - TAM / 2 + .5); pinosBase.setMatrixAt(i++, m); } }
pinosBase.receiveShadow = true; cena.add(pinosBase);

// ── formas simples, usadas quando não há modelo do Meshy ──
const mat = (cor, extra = {}) => new THREE.MeshStandardMaterial({ color: cor, roughness: .55, ...extra });
function forma(p) {
    const [w, h, d] = p.tamanho, H = h * ALT, g = new THREE.Group();
    const add = (geo, m, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; g.add(o); return o; };
    const pinos = (m, yTopo) => { for (let i = 0; i < w; i++) for (let k = 0; k < d; k++) add(pinoGeo, m, i - w / 2 + .5, yTopo + .08, k - d / 2 + .5); };
    const cor = mat(p.cor);
    switch (p.categoria) {
        case 'roda': {
            const r = Math.min(h, d) / 2 - .05;
            if (p.id === 'esteira') {
                add(new THREE.BoxGeometry(w - .1, H - .1, d - .1), mat(p.cor, { roughness: .95 }));
                for (const z of [-d / 2 + .8, d / 2 - .8]) add(new THREE.CylinderGeometry(.75, .75, w + .02, 20).rotateZ(Math.PI / 2), mat('#777'), 0, 0, z);
            } else {
                add(new THREE.CylinderGeometry(r, r, w - .1, 28).rotateZ(Math.PI / 2), mat(p.cor, { roughness: .95 }));
                add(new THREE.CylinderGeometry(r * .5, r * .5, w, 20).rotateZ(Math.PI / 2), mat('#d9d9d9'));
            }
            break;
        }
        case 'motor':
            if (p.id === 'garra') {
                add(new THREE.BoxGeometry(w - .1, H * .45, d - .1), cor, 0, -H * .27, 0);
                for (const x of [-w / 2 + .3, w / 2 - .3]) add(new THREE.BoxGeometry(.25, H * .55, d * .5), mat('#555'), x, H * .2, d * .2);
            } else {
                add(new THREE.BoxGeometry(w - .06, H - .06, d - .06), cor);
                add(new THREE.CylinderGeometry(.18, .18, .6, 12).rotateZ(Math.PI / 2), mat('#f76b15'), w / 2 + .2, 0, 0);
            }
            break;
        case 'sensor':
            add(new THREE.BoxGeometry(w - .06, H - .06, d - .06), cor);
            for (let i = 0; i < Math.max(1, w); i++) add(new THREE.CylinderGeometry(.22, .22, .2, 16).rotateX(Math.PI / 2), mat('#111a2b', { metalness: .3, roughness: .2 }), w === 1 ? 0 : (i ? .45 : -.45), 0, d / 2 + .05);
            break;
        case 'controlador':
            add(new THREE.BoxGeometry(w - .06, H - .06, d - .06), cor);
            add(new THREE.BoxGeometry(w * .7, .04, d * .45), mat('#18202a', { emissive: '#1b4fd6', emissiveIntensity: .35 }), 0, H / 2 - .01, -d * .15);
            break;
        case 'enfeite':
            if (p.id === 'antena') {
                add(new THREE.CylinderGeometry(.07, .07, H - .3, 10), mat('#bdbdbd'), 0, -.15, 0);
                add(new THREE.SphereGeometry(.22, 16, 12), mat('#ff4d4f', { emissive: '#ff4d4f', emissiveIntensity: .4 }), 0, H / 2 - .2, 0);
            } else add(new THREE.SphereGeometry(.38, 20, 14), mat(p.cor, { emissive: p.cor, emissiveIntensity: .6 }));
            break;
        default:
            add(new THREE.BoxGeometry(w - .04, H - .02, d - .04), cor);
            pinos(cor, H / 2);
    }
    return g;
}

// ── modelos do Meshy (.glb), quando existirem ──
const carregador = new GLTFLoader(), modelos = {};
async function carregarModelo(p) {
    const url = api.modelo(p.id);
    if (!url || p.id in modelos) return;
    modelos[p.id] = null;
    try {
        const r = await fetch(url, { method: 'HEAD' });
        if (!r.ok) return;
        const gltf = await carregador.loadAsync(url);
        const obj = gltf.scene, caixa = new THREE.Box3().setFromObject(obj), tam = caixa.getSize(new THREE.Vector3());
        const [w, h, d] = p.tamanho, escala = Math.min(w / tam.x, (h * ALT) / tam.y, d / tam.z);
        obj.scale.setScalar(escala);
        const centro = new THREE.Box3().setFromObject(obj).getCenter(new THREE.Vector3());
        obj.position.sub(centro);
        obj.traverse(o => { if (o.isMesh) o.castShadow = o.receiveShadow = true; });
        modelos[p.id] = obj;
    } catch { /* sem modelo: usa a forma simples */ }
}
const objeto3d = (p) => { const g = new THREE.Group(); g.add(modelos[p.id] ? modelos[p.id].clone() : forma(p)); return g; };

// ═════════════════════════ MONTAGEM ═════════════════════════
const robo = [];               // { peca_id, x, y, z, giro, obj }
const ocupado = new Map();     // "x,y,z" → item
const chave = (x, y, z) => `${x},${y},${z}`;
const pegada = (p, g) => { const [w, h, d] = p.tamanho; return g % 180 ? [d, h, w] : [w, h, d]; };

function celulas(p, x, y, z, g) {
    const [w, h, d] = pegada(p, g), lista = [];
    for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) for (let k = 0; k < d; k++) lista.push(chave(x + i, y + j, z + k));
    return lista;
}
function cabe(p, x, y, z, g) {
    const [w, , d] = pegada(p, g), lim = TAM / 2;
    if (x < -lim || z < -lim || x + w > lim || z + d > lim || y < 0 || y > 40) return false;
    return celulas(p, x, y, z, g).every(c => !ocupado.has(c));
}
function posicionar(obj, p, x, y, z, g) {
    const [w, h, d] = pegada(p, g);
    obj.position.set(x + w / 2, y * ALT + (h * ALT) / 2, z + d / 2);
    obj.rotation.y = -g * Math.PI / 180;
}
function colocar(peca_id, x, y, z, g) {
    const p = porId()[peca_id];
    if (!p || !cabe(p, x, y, z, g)) return false;
    const obj = objeto3d(p);
    posicionar(obj, p, x, y, z, g);
    const item = { peca_id, x, y, z, giro: g, obj };
    obj.traverse(o => o.userData.item = item);
    cena.add(obj); robo.push(item);
    celulas(p, x, y, z, g).forEach(c => ocupado.set(c, item));
    return true;
}
function tirar(item) {
    const p = porId()[item.peca_id];
    celulas(p, item.x, item.y, item.z, item.giro).forEach(c => ocupado.delete(c));
    if (destacado === item) destacado = null;
    cena.remove(item.obj); robo.splice(robo.indexOf(item), 1);
}

// ── fantasma: mostra onde a peça vai entrar ──
let fantasma = null, alvo = null;
function trocarFantasma() {
    if (fantasma) cena.remove(fantasma);
    const p = porId()[pecaAtual];
    fantasma = objeto3d(p);
    fantasma.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.transparent = true; o.material.opacity = .5; o.castShadow = false; } });
    fantasma.visible = false; cena.add(fantasma);
}
function pintarFantasma(ok) {
    fantasma.traverse(o => { if (o.isMesh) o.material.emissive?.set(ok ? 0x000000 : 0xff2222); });
}

const raio = new THREE.Raycaster(), ponteiro = new THREE.Vector2();
function mirar(ev) {
    const r = renderer.domElement.getBoundingClientRect();
    ponteiro.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    raio.setFromCamera(ponteiro, camera);
    const alvos = [base, ...robo.map(i => i.obj)];
    return raio.intersectObjects(alvos, true)[0] || null;
}
function calcularAlvo(hit) {
    if (!hit) return null;
    const item = hit.object.userData.item;
    if (modo === 'apagar') return item ? { item } : null;
    const p = porId()[pecaAtual], [w, , d] = pegada(p, giro);
    const n = hit.face ? hit.face.normal.clone().transformDirection(hit.object.matrixWorld) : new THREE.Vector3(0, 1, 0);
    const pt = hit.point.clone().addScaledVector(n, .01);
    let y = 0;
    if (item) {
        y = n.y > .5 ? item.y + pegada(porId()[item.peca_id], item.giro)[1] : Math.max(0, Math.floor(pt.y / ALT));
    }
    const cx = Math.floor(pt.x), cz = Math.floor(pt.z);
    const x = cx - Math.floor((w - 1) / 2), z = cz - Math.floor((d - 1) / 2);
    return { x, y, z, ok: cabe(p, x, y, z, giro) };
}
// Destaca em vermelho a peça que vai sair, guardando o brilho original (LEDs brilham!).
let destacado = null;
function destacar(item) {
    if (destacado === item) return;
    destacado?.obj.traverse(o => { if (o.isMesh && o.userData.brilho !== undefined) o.material.emissive.setHex(o.userData.brilho); });
    destacado = item;
    item?.obj.traverse(o => { if (o.isMesh && o.material.emissive) { o.userData.brilho ??= o.material.emissive.getHex(); o.material.emissive.setHex(0x661111); } });
}
function atualizarMira(ev) {
    if (travado()) return;   // com o robô ligado ou lutando, a bancada fica travada
    alvo = calcularAlvo(mirar(ev));
    destacar(modo === 'apagar' ? alvo?.item ?? null : null);
    if (modo === 'apagar') { fantasma.visible = false; return; }
    if (!alvo) { fantasma.visible = false; return; }
    posicionar(fantasma, porId()[pecaAtual], alvo.x, alvo.y, alvo.z, giro);
    pintarFantasma(alvo.ok); fantasma.visible = true;
}

let inicio = null;
renderer.domElement.addEventListener('pointermove', atualizarMira);
renderer.domElement.addEventListener('pointerleave', () => { if (fantasma) fantasma.visible = false; });
renderer.domElement.addEventListener('pointerdown', ev => inicio = [ev.clientX, ev.clientY]);
renderer.domElement.addEventListener('pointerup', ev => {
    if (travado() || !inicio || Math.hypot(ev.clientX - inicio[0], ev.clientY - inicio[1]) > 6) return;
    atualizarMira(ev);
    if (!alvo) return;
    if (modo === 'apagar') { tirar(alvo.item); salvarDepois(); }
    else if (alvo.ok) { colocar(pecaAtual, alvo.x, alvo.y, alvo.z, giro); salvarDepois(); }
    else avisar('Não cabe aí! Tente outro lugar ou gire a peça.');
    atualizarMira(ev);
});

function girar() { giro = (giro + 90) % 360; if (fantasma && alvo && !alvo.item) { const p = porId()[pecaAtual]; alvo.ok = cabe(p, alvo.x, alvo.y, alvo.z, giro); posicionar(fantasma, p, alvo.x, alvo.y, alvo.z, giro); pintarFantasma(alvo.ok); } }
function escolherModo(m) {
    modo = m;
    $('modo-colocar').setAttribute('aria-pressed', m === 'colocar');
    $('modo-apagar').setAttribute('aria-pressed', m === 'apagar');
    if (fantasma) fantasma.visible = false;
}
$('modo-colocar').onclick = () => escolherModo('colocar');
$('modo-apagar').onclick = () => escolherModo('apagar');
$('girar').onclick = girar;
$('limpar').onclick = () => {
    if (luta) return;
    if (sim) parar();
    if ($('limpar').dataset.confirmar) { [...robo].forEach(tirar); salvarDepois(); delete $('limpar').dataset.confirmar; $('limpar').textContent = '🗑 Limpar tudo'; return; }
    $('limpar').dataset.confirmar = '1'; $('limpar').textContent = '🗑 Tem certeza?';
    setTimeout(() => { delete $('limpar').dataset.confirmar; $('limpar').textContent = '🗑 Limpar tudo'; }, 3000);
};
addEventListener('keydown', ev => {
    if (ev.target.closest('input, textarea')) return;
    if (travado()) return;
    if (ev.key === 'r' || ev.key === 'R') girar();
    if (ev.key === 'Delete' || ev.key === 'Backspace') escolherModo(modo === 'apagar' ? 'colocar' : 'apagar');
});

// ── salvar o robô (espera 0,8 s parado para não salvar a cada clique) ──
function salvarDepois() {
    $('status').textContent = 'Salvando…';
    clearTimeout(salvarDepois.t);
    salvarDepois.t = setTimeout(async () => {
        try {
            eu = await api.salvarRobo(robo.map(({ peca_id, x, y, z, giro }) => ({ peca_id, x, y, z, giro })));
            $('status').textContent = `Salvo ✓ · ${robo.length} peça${robo.length === 1 ? '' : 's'}`;
        } catch (e) { $('status').textContent = 'Não salvou'; avisar('⚠️ ' + maiuscula(e.message)); }
    }, 800);
}

// ═════════════════ SIMULAÇÃO: o robô ganha vida ═════════════════
// Regras da simulação (o que cada peça faz de verdade num robô):
//  • controlador = cérebro: sem ele, nada acontece;
//  • rodas (2+) ou esteira: sem elas, não sai do lugar;
//  • cada motor: mais velocidade (sem motor, só os motorzinhos fracos do controlador);
//  • sensor de distância: enxerga a borda e desvia. Sem ele, o robô bate!
//  • LEDs piscam enquanto o robô está ligado.
const EIXO_Y = new THREE.Vector3(0, 1, 0);
const relogio = new THREE.Clock();
let sim = null, luta = null;
const travado = () => sim || luta;

function diagnosticar() {
    const pecas = robo.map(i => porId()[i.peca_id]);
    const conta = (teste) => pecas.filter(teste).length;
    if (!conta(p => p.categoria === 'controlador')) return 'Seu robô precisa de um 🧠 controlador para pensar!';
    if (conta(p => p.categoria === 'roda' && p.id !== 'esteira') < 2 && !conta(p => p.id === 'esteira'))
        return 'Coloque pelo menos 2 rodas (ou 1 esteira) para ele andar!';
    return null;
}

// Junta as peças num "veículo" só, que se move inteiro, e descobre a frente dele.
function montarVeiculo(itens) {
    const caixa = new THREE.Box3(); itens.forEach(i => caixa.expandByObject(i.obj));
    const centro = caixa.getCenter(new THREE.Vector3()), tam = caixa.getSize(new THREE.Vector3());
    const veiculo = new THREE.Group(); veiculo.position.set(centro.x, 0, centro.z); cena.add(veiculo);
    itens.forEach(i => veiculo.attach(i.obj));
    // As rodas rolam de lado ao eixo delas. Se houver sensor, a frente é para onde ele olha.
    const roda = itens.find(i => porId()[i.peca_id].categoria === 'roda');
    const sensor = itens.find(i => i.peca_id === 'sensor_distancia');
    const frente = roda && roda.giro % 180 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 0, 1);
    if (sensor && new THREE.Vector3(0, 0, 1).applyAxisAngle(EIXO_Y, -sensor.giro * Math.PI / 180).dot(frente) < 0) frente.negate();
    return { veiculo, frente, tam };
}

function ligar() {
    const problema = diagnosticar();
    if (problema) { avisar('🔧 ' + problema); return; }
    destacar(null); if (fantasma) fantasma.visible = false;

    const { veiculo, frente, tam } = montarVeiculo(robo);
    const pega = (f) => robo.filter(i => f(porId()[i.peca_id]));
    const rodas = pega(p => p.categoria === 'roda');
    const sensor = pega(p => p.id === 'sensor_distancia')[0];

    const motores = pega(p => p.categoria === 'motor' && p.id !== 'garra').length;
    let feixe = null;
    if (sensor) {   // o "olhar" do sensor: verde = livre, vermelho = perigo
        feixe = new THREE.Mesh(new THREE.BoxGeometry(.12, .12, 2.5), new THREE.MeshBasicMaterial({ color: 0x22cc66, transparent: true, opacity: .55 }));
        veiculo.add(feixe);
    }
    sim = {
        veiculo, frente, feixe, batido: false, tempo: 0,
        raio: Math.max(tam.x, tam.z) / 2,
        velocidade: 1.6 + 1.6 * Math.min(motores, 3),
        rodas: rodas.filter(i => i.peca_id !== 'esteira').map(i => i.obj.children[0]),
        leds: pega(p => p.id === 'led' || p.id === 'antena').flatMap(i => { const m = []; i.obj.traverse(o => o.isMesh && o.material.emissiveIntensity > 0 && m.push(o.material)); return m; }),
    };
    if (feixe) feixe.position.copy(frente.clone().multiplyScalar(sim.raio + 1.25)).setY(.6);
    $('ligar').textContent = '⏹ Parar';
    ['modo-colocar', 'modo-apagar', 'girar'].forEach(id => $(id).disabled = true);
    avisar(motores ? `🚗 Vrumm! ${motores} motor${motores > 1 ? 'es' : ''} ligado${motores > 1 ? 's' : ''}.`
                   : '🐢 Andando devagar… Um ⚙ motor da Loja deixa o robô mais rápido!');
    relogio.getDelta();
}

function parar() {
    for (const item of robo) {
        cena.add(item.obj);
        posicionar(item.obj, porId()[item.peca_id], item.x, item.y, item.z, item.giro);
    }
    sim.rodas.forEach(r => r.rotation.x = 0);
    sim.leds.forEach(m => m.emissiveIntensity = .5);
    cena.remove(sim.veiculo);
    sim = null;
    $('ligar').textContent = '▶ Ligar robô';
    ['modo-colocar', 'modo-apagar', 'girar'].forEach(id => $(id).disabled = false);
    controles.target.set(0, 1, 0);
}

function passoDaSimulacao(dt) {
    sim.tempo += dt;
    sim.leds.forEach(m => m.emissiveIntensity = Math.sin(sim.tempo * 8) > 0 ? 1.4 : .1);
    if (sim.batido) return;
    const v = sim.veiculo, dir = sim.frente.clone().applyAxisAngle(EIXO_Y, v.rotation.y), lim = TAM / 2 - .1;
    const saiDaBancada = (dist) => { const p = v.position.clone().addScaledVector(dir, dist); return Math.abs(p.x) > lim || Math.abs(p.z) > lim; };
    let vel = sim.velocidade;
    if (sim.feixe) {
        const perigo = saiDaBancada(sim.raio + 2.5);
        sim.feixe.material.color.setHex(perigo ? 0xff3344 : 0x22cc66);
        if (perigo) { v.rotation.y += 2.4 * dt; vel *= .25; }   // viu a borda: vira devagar
    } else if (saiDaBancada(sim.raio)) {
        sim.batido = true;
        avisar('💥 Bateu na borda! Coloque um 📡 sensor de distância para ele desviar sozinho.');
        return;
    }
    v.position.addScaledVector(dir, vel * dt);
    sim.rodas.forEach(r => r.rotation.x += vel * dt / .9);
    controles.target.lerp(new THREE.Vector3(v.position.x, 1, v.position.z), .05);
}

$('ligar').onclick = () => { if (!luta) sim ? parar() : ligar(); };

async function salvarAgora() {
    clearTimeout(salvarDepois.t);
    eu = await api.salvarRobo(robo.map(({ peca_id, x, y, z, giro }) => ({ peca_id, x, y, z, giro })));
    $('status').textContent = `Salvo ✓ · ${robo.length} peça${robo.length === 1 ? '' : 's'}`;
}

// ═════════════════ ARENA: batalha de robôs ═════════════════
// Quem decide a luta é o SERVIDOR, para ninguém trapacear nos tokens.
// Aqui a página só "passa o filme" da luta, golpe a golpe.
const DURACAO_GOLPE = 1.1;
const anguloDe = (v) => Math.atan2(v.x, v.z);
const virarPara = (m, alvo) => { m.veiculo.rotation.y = anguloDe(alvo) - anguloDe(m.frente); };

async function comecarLuta(rival) {
    if (travado()) return;
    let res;
    try { await salvarAgora(); res = await api.batalhar(rival.id); }
    catch (e) { avisar('⚠️ ' + maiuscula(e.message)); return; }
    destacar(null); if (fantasma) fantasma.visible = false;
    const meu = montarVeiculo(robo);
    const itensRival = rival.pecas.map(c => {
        const p = porId()[c.peca_id], obj = objeto3d(p);
        posicionar(obj, p, c.x, c.y, c.z, c.giro); cena.add(obj);
        return { ...c, obj };
    });
    const dele = montarVeiculo(itensRival);
    meu.veiculo.position.set(-6, 0, 0); dele.veiculo.position.set(6, 0, 0);
    virarPara(meu, new THREE.Vector3(1, 0, 0)); virarPara(dele, new THREE.Vector3(-1, 0, 0));
    luta = { rival, res, meu, dele, i: 0, t: 0, fim: false, bateu: false, relato: [],
             vida: { voce: res.voce.vida, rival: res.rival.vida } };
    controles.target.set(0, 1, 0);
    ['modo-colocar', 'modo-apagar', 'girar', 'ligar', 'limpar'].forEach(id => $(id).disabled = true);
    $('status').textContent = '⚔️ Batalha!';
    aba = 'arena'; desenharPainel();
}

function passoDaLuta(dt) {
    const L = luta;
    L.t += dt;
    if (L.fim) {   // quem ganhou pula de alegria, quem perdeu tomba
        const ganhou = { voce: L.meu, rival: L.dele }[L.res.vencedor], perdeu = ganhou === L.meu ? L.dele : ganhou === L.dele ? L.meu : null;
        if (ganhou) ganhou.veiculo.position.y = Math.abs(Math.sin(L.t * 6)) * .8;
        if (perdeu) perdeu.veiculo.rotation.z = Math.min(L.t * 2, 1.3) * (perdeu === L.meu ? 1 : -1);
        return;
    }
    const g = L.res.golpes[L.i], sou = g.atacante === 'voce';
    const atac = sou ? L.meu : L.dele, alvo = sou ? L.dele : L.meu;
    const xAtac = sou ? -6 : 6, xAlvo = -xAtac, f = L.t / DURACAO_GOLPE;
    const avanco = f < .4 ? f / .4 : Math.max(0, 1 - (f - .4) / .6);   // vai rápido, volta devagar
    // Cada golpe tem um jeito de se mexer
    const alcance = { turbo: 4.6, atropelar: 4.2, laser: 1.2, pisca: 1.2 }[g.golpe] ?? 3.4;
    atac.veiculo.position.x = xAtac + (sou ? 1 : -1) * alcance * Math.sin(avanco * Math.PI / 2);
    atac.veiculo.position.y = g.golpe === 'martelada' ? Math.sin(Math.min(f / .4, 1) * Math.PI) * .9 : 0;   // pula e bate de cima
    const doeu = g.acertou && f > .4 && f < .75;
    alvo.veiculo.position.x = xAlvo + (doeu ? Math.sin(L.t * 70) * (g.efeito === 'critico' ? .35 : .18) : 0);
    alvo.veiculo.position.y = doeu && g.golpe === 'atropelar' ? -.25 : 0;                                  // amassado!
    alvo.veiculo.rotation.x = doeu && g.efeito === 'tonto' ? Math.sin(L.t * 25) * .25 : 0;                  // fica tonto
    efeitoDeLuz(g, atac, alvo, f);
    if (!L.bateu && f >= .4) {
        L.bateu = true;
        L.vida = { voce: g.vida_voce, rival: g.vida_rival };
        const quem = sou ? 'Você' : L.rival.nome;
        const m = catalogo.golpes?.[g.golpe] || { emoji: '💥', nome: 'Golpe' };
        const EFEITOS = { critico: ' 🎯 CRÍTICO!', tonto: ' 😵 ficou tonto e perdeu a vez!', ofuscado: ' ✨ ficou ofuscado!' };
        L.relato.unshift(g.acertou ? `${m.emoji} ${quem}: ${m.nome}! −${g.dano}${EFEITOS[g.efeito] || ''}` : `💨 ${quem} tentou ${m.nome} e errou!`);
        $('status').textContent = `${quem}: ` + (g.acertou ? `${m.emoji} ${m.nome}${g.efeito === 'critico' ? ' CRÍTICO!' : ''}` : '💨 errou!');
        if (aba === 'arena') desenharPainel();
    }
    if (f >= 1) {
        atac.veiculo.position.set(xAtac, 0, 0); alvo.veiculo.position.set(xAlvo, 0, 0); alvo.veiculo.rotation.x = 0;
        L.i++; L.t = 0; L.bateu = false;
        if (L.i >= L.res.golpes.length) { L.fim = true; eu = L.res; mostrarSaldo(L.res.premio > 0); desenharPainel(); }
    }
}

// Raio do laser e clarão do pisca-pisca (criados uma vez só e reaproveitados)
let feixeLaser = null, clarao = null;
function efeitoDeLuz(g, atac, alvo, f) {
    if (!feixeLaser) {
        feixeLaser = new THREE.Mesh(new THREE.BoxGeometry(1, .14, .14), new THREE.MeshBasicMaterial({ color: 0xff2d55, transparent: true, opacity: .8 }));
        clarao = new THREE.PointLight(0xfff3a0, 0, 14);
        cena.add(feixeLaser, clarao);
    }
    const ligado = f > .25 && f < .6;
    feixeLaser.visible = g.golpe === 'laser' && ligado;
    if (feixeLaser.visible) {
        const a = atac.veiculo.position, b = alvo.veiculo.position, fim = g.acertou ? b.x : b.x + (b.x > a.x ? 4 : -4);
        feixeLaser.scale.x = Math.abs(fim - a.x); feixeLaser.position.set((a.x + fim) / 2, 1.2, g.acertou ? 0 : .8);
    }
    clarao.intensity = g.golpe === 'pisca' && ligado ? 60 * Math.abs(Math.sin(f * 40)) : 0;
    clarao.position.set(atac.veiculo.position.x, 2.5, 0);
}

function sairDaLuta() {
    if (feixeLaser) { feixeLaser.visible = false; clarao.intensity = 0; }
    for (const item of robo) { cena.add(item.obj); posicionar(item.obj, porId()[item.peca_id], item.x, item.y, item.z, item.giro); }
    cena.remove(luta.meu.veiculo); cena.remove(luta.dele.veiculo);
    luta = null;
    ['modo-colocar', 'modo-apagar', 'girar', 'ligar', 'limpar'].forEach(id => $(id).disabled = false);
    $('status').textContent = `${robo.length} peças na bancada`;
    desenharPainel();
}

function redimensionar() {
    const { clientWidth: w, clientHeight: h } = bancada;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(redimensionar).observe(bancada);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    const c = getComputedStyle(document.documentElement);
    cena.background.set(c.getPropertyValue('--cena').trim()); base.material.color.set(c.getPropertyValue('--base').trim());
});
renderer.setAnimationLoop(() => {
    const dt = Math.min(relogio.getDelta(), .05);
    if (sim) passoDaSimulacao(dt);
    if (luta) passoDaLuta(dt);
    controles.update(); renderer.render(cena, camera);
});

// ═════════════════════════ PAINEL ═════════════════════════
const TRILHAS = { scratch: 'Scratch', lego_spike: 'LEGO SPIKE', lego_ev3: 'LEGO EV3', arduino: 'Arduino', robotica: 'Robótica' };
const el = (tag, props = {}, ...filhos) => { const n = Object.assign(document.createElement(tag), props); n.append(...filhos); return n; };
const amostra = (p) => el('span', { className: 'amostra', style: `background:${p.cor}` });

function desenharPainel() {
    document.querySelectorAll('.aba').forEach(b => b.setAttribute('aria-selected', b.dataset.aba === aba));
    const c = $('conteudo'); c.replaceChildren();
    const meus = new Set(eu.pecas);
    if (aba === 'pecas') {
        c.append(el('p', { className: 'explica', textContent: 'Escolha uma peça e clique na bancada. Cada peça que você tem pode ser usada quantas vezes quiser.' }));
        const g = el('div', { className: 'grade-pecas' });
        for (const p of catalogo.pecas.filter(p => meus.has(p.id))) {
            g.append(el('button', { className: 'peca', title: p.descricao, onclick: () => { pecaAtual = p.id; escolherModo('colocar'); trocarFantasma(); desenharPainel(); } }, amostra(p), p.nome));
            g.lastChild.setAttribute('aria-pressed', p.id === pecaAtual);
        }
        c.append(g);
    }
    if (aba === 'loja') {
        const aVenda = catalogo.pecas.filter(p => !meus.has(p.id));
        c.append(el('p', { className: 'explica', textContent: aVenda.length ? 'Troque seus tokens por peças novas. Ganhe tokens na aba Desafios.' : 'Você já tem todas as peças! 🏆' }));
        for (const p of aVenda) {
            const falta = p.preco - eu.saldo;
            const b = el('button', { className: 'botao', disabled: falta > 0, textContent: falta > 0 ? `Faltam ${falta}` : `⚙ ${p.preco}` });
            b.onclick = async () => {
                try { eu = await api.comprar(p.id); await carregarModelo(p); mostrarSaldo(true); avisar(`🎉 Você ganhou: ${p.nome}!`); desenharPainel(); }
                catch (e) { avisar('⚠️ ' + maiuscula(e.message)); }
            };
            c.append(el('div', { className: 'item' }, amostra(p), el('div', {}, el('strong', { textContent: p.nome }), el('p', { textContent: p.descricao })), b));
        }
    }
    if (aba === 'desafios') {
        const feitos = new Set(eu.desafios_feitos);
        c.append(el('p', { className: 'explica', textContent: `Acerte para ganhar tokens. Você já resolveu ${feitos.size} de ${catalogo.desafios.length}.` }));
        const filtros = el('div', { className: 'filtros' });
        for (const [id, nome] of [['todos', 'Todos'], ['facil', 'Fácil'], ['medio', 'Médio'], ['dificil', 'Difícil']]) {
            const b = el('button', { className: 'chip', textContent: nome, onclick: () => { nivelFiltro = id; desenharPainel(); } });
            b.setAttribute('aria-pressed', nivelFiltro === id); filtros.append(b);
        }
        c.append(filtros);
        let trilha = null;
        const lista = catalogo.desafios.filter(d => nivelFiltro === 'todos' || (d.nivel || 'facil') === nivelFiltro)
            .sort((a, b) => a.trilha.localeCompare(b.trilha) || ORDEM_NIVEL[a.nivel || 'facil'] - ORDEM_NIVEL[b.nivel || 'facil']);
        for (const d of lista) {
            if (d.trilha !== trilha) { trilha = d.trilha; c.append(el('div', { className: 'trilha', textContent: TRILHAS[trilha] || trilha })); }
            const card = el('div', { className: 'desafio' },
                el('h3', {}, el('span', { textContent: d.titulo }), el('span', { className: 'premio', textContent: `+${d.recompensa}` })),
                el('span', { className: 'nivel nivel-' + (d.nivel || 'facil'), textContent: NOMES_NIVEL[d.nivel || 'facil'] }),
                el('p', { textContent: d.pergunta }));
            card.querySelector('.nivel').style.justifySelf = 'start';
            if (feitos.has(d.id)) card.append(el('span', { className: 'feito', textContent: '✓ Resolvido' }));
            else {
                const ops = el('div', { className: 'opcoes' });
                d.opcoes.forEach((texto, i) => ops.append(el('button', {
                    className: 'opcao', textContent: texto,
                    onclick: async () => {
                        try {
                            const r = await api.desafio(d.id, i);
                            eu = r; avisar((r.acertou ? `✅ +${d.recompensa} tokens! ` : '🤔 ') + r.explicacao);
                            if (r.acertou) mostrarSaldo(true);
                            desenharPainel();
                        } catch (e) { avisar('⚠️ ' + maiuscula(e.message)); }
                    },
                })));
                card.append(ops);
            }
            c.append(card);
        }
    }
    if (aba === 'arena') desenharArena(c);
    if (aba === 'tokens') {
        c.append(el('h2', { textContent: 'Pacotes de tokens' }),
            el('p', { className: 'explica', textContent: 'A compra é feita por um adulto responsável. Ainda está em construção: por enquanto, os tokens vêm dos desafios.' }));
        for (const pac of catalogo.pacotes) {
            const preco = (pac.preco_centavos / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            const b = el('button', { className: 'botao amarelo', textContent: preco });
            b.onclick = async () => { try { const r = await api.comprarTokens(pac.id); avisar('Peça para um adulto abrir: ' + r.link_pagamento); } catch (e) { avisar('🔒 ' + maiuscula(e.message)); } };
            c.append(el('div', { className: 'item' }, el('span', { className: 'amostra', style: 'background:var(--amarelo)' }), el('div', {}, el('strong', { textContent: `⚙ ${pac.tokens} tokens` }), el('p', { textContent: 'Pagamento com autorização dos pais' })), b));
        }
    }
}
const NOMES_NIVEL = { facil: 'Fácil', medio: 'Médio', dificil: 'Difícil' }, ORDEM_NIVEL = { facil: 0, medio: 1, dificil: 2 };
let nivelFiltro = 'todos';

const FICHA = [['vida', '❤️ Vida', 200], ['ataque', '🗡 Ataque', 60], ['defesa', '🛡 Defesa', 30], ['velocidade', '⚡ Velocidade', 20], ['precisao', '🎯 Mira', 100]];
function ficha(a) {
    const f = el('div', { className: 'ficha' });
    for (const [k, nome, max] of FICHA) {
        const barra = el('div', { className: 'barra' }, el('i', { style: `width:${Math.round(100 * a[k] / max)}%` }));
        f.append(el('div', { className: 'ficha-linha' }, el('span', { textContent: nome }), barra, el('span', { textContent: a[k] + (k === 'precisao' ? '%' : '') })));
    }
    if (a.golpes && catalogo.golpes) f.append(el('div', { className: 'golpes' }, ...a.golpes.map(g => {
        const m = catalogo.golpes[g];
        return el('span', { className: 'golpe', textContent: `${m.emoji} ${m.nome}`, title: m.descricao });
    })));
    return f;
}

async function desenharArena(c) {
    if (luta) {
        const L = luta, pct = (v, max) => `width:${Math.round(100 * v / max)}%`;
        c.append(el('h2', { textContent: `⚔️ Você × ${L.rival.nome}` }),
            el('div', { className: 'placar' },
                el('div', { className: 'lutador' }, el('strong', {}, el('span', { textContent: '🤖 Seu robô' }), el('span', { textContent: `${L.vida.voce} / ${L.res.voce.vida}` })),
                    el('div', { className: 'vida voce' }, el('i', { style: pct(L.vida.voce, L.res.voce.vida) }))),
                el('div', { className: 'lutador' }, el('strong', {}, el('span', { textContent: '👾 ' + L.rival.nome }), el('span', { textContent: `${L.vida.rival} / ${L.res.rival.vida}` })),
                    el('div', { className: 'vida rival' }, el('i', { style: pct(L.vida.rival, L.res.rival.vida) })))));
        if (L.fim) {
            const v = L.res.vencedor;
            c.append(el('div', { className: 'resultado' },
                el('strong', { textContent: v === 'voce' ? '🏆 Você venceu!' : v === 'rival' ? `😵 ${L.rival.nome} venceu` : '🤝 Empate!' }),
                el('span', { textContent: v === 'voce' ? (L.res.premio ? `+${L.res.premio} tokens de prêmio!` : 'Revanche vencida! O prêmio só vale na primeira vitória.')
                    : 'Dica: mais estrutura dá vida, garras dão ataque, motores dão velocidade e sensores melhoram a mira.' }),
                el('button', { className: 'botao', textContent: '↩ Voltar à bancada', onclick: sairDaLuta })));
        }
        c.append(el('ul', { className: 'relato' }, ...L.relato.slice(0, 8).map(t => el('li', { textContent: t }))));
        return;
    }
    c.append(el('p', { className: 'explica', textContent: 'Carregando a Arena…' }));
    const vez = desenharArena.vez = (desenharArena.vez || 0) + 1;
    let dados;
    try { await salvarAgora(); dados = await api.arena(); }
    catch (e) { c.replaceChildren(el('p', { className: 'explica', textContent: '⚠️ ' + maiuscula(e.message) })); return; }
    if (aba !== 'arena' || luta || vez !== desenharArena.vez) return;   // trocou de aba ou abriu de novo enquanto carregava
    c.replaceChildren(el('h2', { textContent: '🤖 Seu robô' }));
    if (dados.meus_atributos) c.append(ficha(dados.meus_atributos));
    else c.append(el('p', { className: 'explica', textContent: '🔧 ' + maiuscula(dados.problema) + '. Monte na bancada e volte aqui!' }));
    c.append(el('p', { className: 'explica', textContent: 'Cada peça muda a ficha: estrutura dá vida e defesa, garras e servos dão ataque, motores dão velocidade e sensores melhoram a mira. Peças especiais destravam golpes novos: garra, servo, 2 motores, esteira, sensor de distância e LED.' }),
        el('h2', { textContent: 'Rivais' }));
    for (const r of dados.rivais) {
        const b = el('button', { className: 'botao', textContent: '⚔️ Lutar!', disabled: !dados.meus_atributos, onclick: () => comecarLuta(r) });
        c.append(el('div', { className: 'rival' },
            el('h3', {}, el('span', { textContent: r.nome }), el('span', { className: 'nivel nivel-' + r.nivel, textContent: NOMES_NIVEL[r.nivel] }),
                el('span', { className: 'premio', textContent: r.vencido ? '✓ vencido' : `🏆 +${r.premio}` })),
            el('p', { textContent: r.descricao }), ficha(r.atributos), b));
    }
}

document.querySelectorAll('.aba').forEach(b => b.onclick = () => { if (!luta) { aba = b.dataset.aba; desenharPainel(); } });

// ═════════════════════════ COMEÇAR ═════════════════════════
(async () => {
    if (api.demo) { $('selo-demo').hidden = false; $('link-tutor').hidden = true; }
    try {
        catalogo = await api.catalogo();
        eu = await api.entrar();
        await Promise.allSettled(catalogo.pecas.filter(p => eu.pecas.includes(p.id)).map(carregarModelo));
        for (const c of eu.robo) colocar(c.peca_id, c.x, c.y, c.z, c.giro);
        if (!robo.length) {   // um carrinho de exemplo para começar
            [['placa_4x6', -2, 0, -3, 0], ['controlador', -1, 1, -2, 0], ['roda_pequena', -3, 0, -3, 0], ['roda_pequena', 2, 0, -3, 0],
             ['roda_pequena', -3, 0, 1, 0], ['roda_pequena', 2, 0, 1, 0], ['bloco_2x2', -1, 1, 1, 0]].forEach(a => colocar(...a));
        }
        $('status').textContent = `${robo.length} peças na bancada`;
        mostrarSaldo(false); trocarFantasma(); desenharPainel();
    } catch (e) {
        $('status').textContent = 'Sem conexão';
        avisar('📡 Não consegui abrir a oficina: ' + e.message);
    }
})();
</script>
